name: UART regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test serial disconnect and healthy reads
        run: python3 tests/test_uart_disconnect.py
      - name: Build MMDVMHost
        run: make -j2
